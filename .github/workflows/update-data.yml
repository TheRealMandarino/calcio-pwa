name: Update match data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-match-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh fixtures, results, predictions and odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m backend.calcio.daily_refresh

      - name: Refresh Formula 1 data and predictions
        run: python -m backend.formula1 --update --start-year 2024 --no-details

      - name: Publish updated static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bookmaker-odds.json docs/data-status.json \
            docs/eng-championship.json docs/eng-premier_league.json \
            docs/esp-la_liga.json docs/fra-ligue_1.json \
            docs/ger-bundesliga.json docs/ita-serie_a.json \
            docs/ita-serie_b.json \
            docs/formula1/formula1-data.json docs/formula1/formula1-data.js
          if git diff --cached --quiet; then
            echo "No data changes to publish."
            exit 0
          fi
          git commit -m "Update match and motorsport data"
          git push
